services:
  moonlight-web:
    image: "mrcreativ3001/moonlight-web-stream@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    restart: unless-stopped
    environment:
      BIND_ADDRESS: "0.0.0.0:8080"
      PATH_PREFIX: "/vm/alpha"
      WEBRTC_PORT_RANGE: "41000:41010"
    volumes:
      - ./server:/moonlight-web/server
    networks:
      - proxy
      - egress
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/vm/alpha/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    labels:
      traefik.enable: "true"
      com.blobevm.managed: "1"
      com.epicvm.console: "moonlight"
      com.epicvm.vm.name: "alpha"
      traefik.docker.network: "proxy"
      traefik.http.routers.epicvm-alpha.rule: "Host(`techexplore.us`) && PathPrefix(`/vm/alpha/`)"
      traefik.http.routers.epicvm-alpha.entrypoints: "websecure"
      traefik.http.routers.epicvm-alpha.tls: "true"
      traefik.http.routers.epicvm-alpha.tls.certresolver: "myresolver"
      traefik.http.routers.epicvm-alpha.priority: "600"
      traefik.http.routers.epicvm-alpha.service: "epicvm-alpha"
      traefik.http.routers.epicvm-alpha.middlewares: "epicvm-alpha-portal-auth,epicvm-alpha-portal-user"
      traefik.http.middlewares.epicvm-alpha-portal-auth.forwardauth.address: "http://blobedash:5000/dashboard/auth/vm/alpha"
      traefik.http.middlewares.epicvm-alpha-portal-auth.forwardauth.trustForwardHeader: "true"
      traefik.http.middlewares.epicvm-alpha-portal-user.headers.customrequestheaders.X-EpicVM-User: "alpha"
      traefik.http.services.epicvm-alpha.loadbalancer.server.port: "8080"
networks:
  proxy:
    external: true
  egress:
    driver: bridge
